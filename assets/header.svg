<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>Edward Lik · developer from Almaty</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#1d1340"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee8fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0; 0.3 0; -0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="320" rx="22"/>
    </clipPath>
    <style>
      .code { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; font-size: 22px; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>

    <g filter="url(#blur)" opacity="0.75">
      <circle cx="980" cy="70" r="120" fill="#7c3aed">
        <animate attributeName="cx" values="980;1080;980" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="70;120;70" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1150" cy="260" r="110" fill="#0ea5e9">
        <animate attributeName="cx" values="1150;1040;1150" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="330" r="120" fill="#db2777" opacity="0.55">
        <animate attributeName="cx" values="160;300;160" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(64 0)">
      <text x="0" y="82" font-size="30" fill="#94a3b8">Hi there, I'm 👋</text>
      <text x="-4" y="176" font-size="96" font-weight="800" fill="url(#name)" letter-spacing="-2">Edward Lik</text>
      <g font-size="36" fill="#cbd5e1">
        <text x="0" y="232" opacity="1">Developer from Almaty, Kazakhstan
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="12s" begin="0s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 -10;0 -10" keyTimes="0;0.04;0.29;0.33;1" dur="12s" begin="0s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="232" opacity="0">Python · TypeScript · C# · Dart
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="12s" begin="4s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 -10;0 -10" keyTimes="0;0.04;0.29;0.33;1" dur="12s" begin="4s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="232" opacity="0">Web, mobile and desktop apps, bots
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.29;0.33;1" dur="12s" begin="8s" repeatCount="indefinite"/>
          <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 -10;0 -10" keyTimes="0;0.04;0.29;0.33;1" dur="12s" begin="8s" repeatCount="indefinite"/>
        </text>
      </g>
      <text x="0" y="282" font-size="25" fill="#7c8aa3">Small projects that work, with tests and docs</text>
    </g>

    <g class="code" transform="translate(880 112)">
      <rect x="-28" y="-40" width="372" height="182" rx="16" fill="#0b1020" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="-6" cy="-19" r="6" fill="#ff5f57"/>
      <circle cx="13" cy="-19" r="6" fill="#febc2e"/>
      <circle cx="32" cy="-19" r="6" fill="#28c840"/>
      <text y="22"><tspan fill="#c084fc">while</tspan><tspan fill="#e2e8f0"> idea:</tspan></text>
      <text y="56" x="36"><tspan fill="#7dd3fc">build</tspan><tspan fill="#e2e8f0">(idea)</tspan></text>
      <text y="90" x="36"><tspan fill="#7dd3fc">test</tspan><tspan fill="#e2e8f0">(idea)</tspan></text>
      <text y="124" x="36"><tspan fill="#7dd3fc">ship</tspan><tspan fill="#e2e8f0">(idea)</tspan><tspan fill="#a78bfa"> ▍<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
</svg>
